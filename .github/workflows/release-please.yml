name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please (PR & Tag)
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/htmx-analyzer'
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-crates:
    name: Publish to crates.io (Auto-triggered)
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable

      - name: Verify workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Publish all crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          publish_crate() {
            local package="$1"
            local max_attempts=12
            local attempt=1
            local delay=15

            local version
            version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; p=json.load(sys.stdin)['packages']; print(next(x['version'] for x in p if x['name'] == '$package'))")

            echo "============================================================"
            echo "==> Publishing $package v$version..."
            echo "============================================================"

            while [ $attempt -le $max_attempts ]; do
              set +e
              output=$(cargo publish -p "$package" 2>&1)
              exit_code=$?
              set -e

              echo "$output"

              if [ $exit_code -eq 0 ]; then
                echo "==> Successfully published $package v$version!"
                return 0
              fi

              if echo "$output" | grep -iqE "already (uploaded|exists)"; then
                echo "==> $package v$version is already on crates.io. Skipping."
                return 0
              fi

              echo "Publish of $package failed (attempt $attempt/$max_attempts). Waiting ${delay}s for crates.io index update..."
              sleep $delay
              attempt=$((attempt + 1))
            done

            echo "Error: Failed to publish $package after $max_attempts attempts." >&2
            return 1
          }

          publish_crate htmx-schema
          publish_crate htmx-vfs
          publish_crate htmx-parser
          publish_crate htmx-service
          publish_crate htmx-analyzer
