name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release Tag and Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure origin/main is fetched
        run: git fetch origin main

      - name: Validate tag matches workspace package version
        run: |
          RAW_TAG="${GITHUB_REF_NAME#v}"
          BASE_TAG="${RAW_TAG%%-*}"
          PKG_VER=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; p=json.load(sys.stdin)["packages"]; print(next(x["version"] for x in p if x["name"] == "htmx-analyzer"))')
          if [ "$BASE_TAG" != "$PKG_VER" ]; then
            echo "Error: Tag '$GITHUB_REF_NAME' (base '$BASE_TAG') does not match cargo package version '$PKG_VER'." >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package version $PKG_VER"

      - name: Validate commit is on main branch
        run: |
          COMMIT_SHA=$(git rev-parse "$GITHUB_REF^{commit}")
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "Error: Tagged commit $COMMIT_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
          echo "Commit $COMMIT_SHA is an ancestor of origin/main"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Run test suite
        run: cargo test --workspace --all-targets --locked

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: htmx-analyzer-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: htmx-analyzer-darwin-x64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: htmx-analyzer-linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset_name: htmx-analyzer-linux-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: htmx-analyzer-windows-x64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset_name: htmx-analyzer-windows-arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p htmx-analyzer

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/htmx-analyzer" "dist/${{ matrix.asset_name }}"
          cd dist && shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp "./target/${{ matrix.target }}/release/htmx-analyzer.exe" "dist/${{ matrix.asset_name }}"
          cd dist && sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/${{ matrix.asset_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            IS_DRAFT=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$IS_DRAFT" = "false" ]; then
              echo "Error: Published release $GITHUB_REF_NAME already exists and is immutable." >&2
              exit 1
            fi
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish Release (undraft)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
