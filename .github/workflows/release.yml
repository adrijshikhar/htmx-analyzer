name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p htmx-analyzer

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/htmx-analyzer"
          ARCHIVE_NAME="htmx-analyzer-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" htmx-analyzer
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_NAME="htmx-analyzer-${{ matrix.target }}.zip"
          7z a "$ARCHIVE_NAME" "./target/${{ matrix.target }}/release/htmx-analyzer.exe"
          certutil -hashfile "$ARCHIVE_NAME" SHA256 | grep -v "hash" | head -n 1 | tr -d ' \r\n' > "$ARCHIVE_NAME.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            htmx-analyzer-${{ matrix.target }}.tar.gz
            htmx-analyzer-${{ matrix.target }}.tar.gz.sha256
            htmx-analyzer-${{ matrix.target }}.zip
            htmx-analyzer-${{ matrix.target }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
