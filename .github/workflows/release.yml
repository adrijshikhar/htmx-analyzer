name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: htmx-analyzer-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            asset_name: htmx-analyzer-darwin-x64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            asset_name: htmx-analyzer-linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_name: htmx-analyzer-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p htmx-analyzer

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/htmx-analyzer" "dist/${{ matrix.asset_name }}"
          ARCHIVE_NAME="htmx-analyzer-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" htmx-analyzer
          cd dist && shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp "./target/${{ matrix.target }}/release/htmx-analyzer.exe" "dist/${{ matrix.asset_name }}"
          ARCHIVE_NAME="htmx-analyzer-${{ matrix.target }}.zip"
          7z a "dist/$ARCHIVE_NAME" "./target/${{ matrix.target }}/release/htmx-analyzer.exe"
          cd dist && sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8afd # v4.6.1
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
