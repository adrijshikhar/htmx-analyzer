name: "Feature Request"
description: "Suggest a feature, diagnostic, or improvement for htmx-analyzer."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature suggestions for HTMX 2.0 language server support!
  - type: textarea
    id: problem
    attributes:
      label: "Problem / Use Case"
      description: "Is your feature request related to a problem or specific HTMX pattern?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe what you would like htmx-analyzer to do (e.g. new diagnostic rule, completion, code action)."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or workarounds you have considered."
    validations:
      required: false
