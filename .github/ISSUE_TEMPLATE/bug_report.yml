name: "Bug Report"
description: "File a bug report for htmx-analyzer."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.
  - type: input
    id: version
    attributes:
      label: "htmx-analyzer Version"
      description: "Run `htmx-analyzer --version` or specify the release version."
      placeholder: "e.g., 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Editor & Operating System"
      description: "Which editor (Zed, Neovim, VSCode) and OS (macOS, Linux, Windows) are you using?"
      placeholder: "e.g., Zed 0.160 on macOS arm64"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: "HTML / HTMX Code Snippet"
      description: "A minimal reproducible example showing the issue."
      render: html
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "LSP Logs / Trace"
      description: "Relevant logs from your editor LSP client or terminal."
      render: text
    validations:
      required: false
