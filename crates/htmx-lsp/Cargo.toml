[package]
name = "htmx-analyzer"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast, robust HTMX 2.0 Language Server (LSP) with autocompletion, hover docs, diagnostics, and quick-fixes"
readme = "README.md"
homepage = "https://github.com/adrijshikhar/htmx-analyzer"
keywords = ["htmx", "htmx2", "lsp", "language-server", "html"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "htmx-analyzer"
path = "src/main.rs"

[lib]
name = "htmx_analyzer"
path = "src/lib.rs"

[dependencies]
htmx-schema = { workspace = true }
htmx-parser = { workspace = true }
htmx-vfs = { workspace = true }
htmx-service = { workspace = true }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
walkdir = { workspace = true }
